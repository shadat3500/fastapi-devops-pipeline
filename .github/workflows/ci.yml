name: CI

# Runs on every PR, and is also called by cd.yml as the gate before any image is pushed.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  # Tool versions pinned in one place; bump deliberately.
  HADOLINT_IMAGE: hadolint/hadolint:v2.12.0
  SHELLCHECK_IMAGE: koalaman/shellcheck:v0.10.0
  TRIVY_IMAGE: aquasec/trivy:0.67.2

jobs:
  lint-test:
    name: Lint, test & coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check --output-format=github .

      - name: Unit tests with coverage
        run: |
          pytest --cov=app --cov-report=term --cov-report=xml:coverage.xml \
                 --junitxml=junit.xml

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Test coverage"
            coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.xml
            junit.xml
          retention-days: 14

  dockerfile-lint:
    name: Dockerfile lint (hadolint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: hadolint
        run: docker run --rm -v "$PWD":/w -w /w "$HADOLINT_IMAGE" hadolint --config .hadolint.yaml Dockerfile

  shell-lint:
    name: Shell lint (shellcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck all *.sh
        run: |
          mapfile -t files < <(git ls-files '*.sh')
          if [ "${#files[@]}" -eq 0 ]; then echo "No shell scripts found"; exit 0; fi
          printf 'Checking: %s\n' "${files[@]}"
          docker run --rm -v "$PWD":/mnt -w /mnt "$SHELLCHECK_IMAGE" --severity=style --external-sources "${files[@]}"

  build-scan:
    name: Build, smoke test & vulnerability scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image (amd64, loaded locally)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: devops-app:ci
          build-args: |
            APP_VERSION=ci-${{ github.sha }}
            VCS_REF=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=ci
          cache-to: type=gha,scope=ci,mode=max

      - name: Report image size
        run: |
          size=$(docker image inspect devops-app:ci --format '{{.Size}}')
          echo "### Image size: $((size / 1024 / 1024)) MB (uncompressed)" >> "$GITHUB_STEP_SUMMARY"

      - name: Container smoke test
        run: |
          docker run -d --name smoke -p 8080:8080 --read-only --tmpfs /tmp devops-app:ci
          for i in $(seq 1 15); do
            if curl -fsS localhost:8080/health; then echo; break; fi
            [ "$i" -eq 15 ] && { docker logs smoke; exit 1; }
            sleep 2
          done
          curl -fsS localhost:8080/ | grep -q '"Hello from DevOps Task!"'
          curl -fsS localhost:8080/metrics | grep -q http_request_duration_seconds_bucket
          # Graceful shutdown: SIGTERM must stop the container cleanly (exit 0) well before the 10s kill.
          docker stop --time 10 smoke
          code=$(docker inspect smoke --format '{{.State.ExitCode}}')
          docker logs smoke | tail -3
          test "$code" -eq 0

      - name: Cache Trivy DB
        uses: actions/cache@v6
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-db-${{ runner.os }}-

      - name: Trivy report (HIGH,CRITICAL - informational)
        run: |
          mkdir -p ~/.cache/trivy
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v ~/.cache/trivy:/root/.cache/trivy -v "$PWD":/w -w /w \
            "$TRIVY_IMAGE" image --no-progress --severity HIGH,CRITICAL \
            --ignorefile .trivyignore --exit-code 0 devops-app:ci

      - name: Trivy gate (fail on CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v ~/.cache/trivy:/root/.cache/trivy -v "$PWD":/w -w /w \
            "$TRIVY_IMAGE" image --no-progress --skip-db-update --severity CRITICAL \
            --ignorefile .trivyignore --exit-code 1 devops-app:ci
