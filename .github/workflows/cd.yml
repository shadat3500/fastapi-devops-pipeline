name: CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      image_tag:
        description: >-
          Existing image tag to (re)deploy, e.g. 1.0.12 or a commit SHA.
          Used for manual rollback; skips the build.
        required: true
        type: string

permissions:
  contents: read

# Never run two deploys at once, and never cancel one halfway through.
concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  ci:
    name: CI gate
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  build-push:
    name: Build & push multi-arch image
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute semantic version
        id: version
        # MAJOR.MINOR comes from the VERSION file (bumped by humans);
        # PATCH is the CD run number, so every release is unique and increasing.
        run: |
          base=$(tr -d '[:space:]' < VERSION)
          echo "version=${base}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags & OCI labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,format=long,prefix=
            type=raw,value=main

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            VCS_REF=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max
          provenance: mode=max
          sbom: true

      - name: Summary
        run: |
          {
            echo "### Pushed image"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    name: Deploy → staging
    needs: build-push
    if: ${{ !cancelled() && !failure() }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image_tag: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || needs.build-push.outputs.version }}
    secrets: inherit

  deploy-production:
    name: Deploy → production
    needs: [build-push, deploy-staging]
    if: ${{ !cancelled() && !failure() }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      image_tag: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || needs.build-push.outputs.version }}
    secrets: inherit
