name: devops-app

services:
  app:
    image: ${APP_IMAGE:-devops-app:local}
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
    container_name: devops-app
    ports:
      # Host port defaults to 8080 (task requirement); override with APP_HOST_PORT
      # if 8080 is already taken on the host, e.g. APP_HOST_PORT=8081.
      - "${APP_HOST_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_ENV: ${APP_ENV:-local}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      ENABLE_ERROR_ENDPOINT: ${ENABLE_ERROR_ENDPOINT:-false}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 25s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M
    labels:
      # Opt-in labels read by Grafana Alloy for log collection (see monitoring/alloy).
      logging.service: app
      app.environment: ${APP_ENV:-local}
    networks:
      - devops-app

networks:
  devops-app:
    # Shared, pre-created network (`docker network create devops-app-net`).
    # It is external because three things attach to it independently: this compose
    # app, the CD-deployed staging/production containers (scripts/deploy.sh) and
    # Prometheus from docker-compose.monitoring.yml.
    name: devops-app-net
    external: true
