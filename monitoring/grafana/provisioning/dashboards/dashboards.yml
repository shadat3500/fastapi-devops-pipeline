apiVersion: 1

providers:
  - name: devops-app
    folder: DevOps App
    type: file
    disableDeletion: true
    allowUiUpdates: false       # dashboards are code: change the JSON in git, not the UI
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
