# Served by Traefik (bundled with k3s). The host is set per overlay.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-app
spec:
  ingressClassName: traefik
  rules:
    - host: devops-app.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-app
                port:
                  name: http
